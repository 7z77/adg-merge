name: Merge ADG Rules

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: Compile and merge rules
        run: |
          mkdir -p merged
          hostlist-compiler -c config.json -o merged/adg-rules.txt

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add merged/*.txt
          git commit -m "chore: auto-merge ADG rules [skip ci]" || exit 0
          git push
