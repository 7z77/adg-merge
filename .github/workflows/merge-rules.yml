name: Merge ADG Rules

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-24.04          # 固定版本，避免 Ubuntu 26 迁移警告
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5   # 升级到 v5，解决 Node.js 20 警告

      - name: Setup Node.js
        uses: actions/setup-node@v5 # 升级到 v5，解决 Node.js 20 警告
        with:
          node-version: 22          # 使用当前 LTS 版本

      - name: Install hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: Compile and merge rules
        run: |
          mkdir -p merged
          hostlist-compiler -c config.json -o merged/adg-rules.txt

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-merge ADG rules"
          file_pattern: "merged/adg-rules.txt"
