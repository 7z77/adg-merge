name: Merge ADG Rules

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-24.04          # 固定版本，避免 Ubuntu 26 迁移警告
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5   # 升级到 v5，解决 Node.js 20 警告

      - name: Setup Node.js
        uses: actions/setup-node@v5 # 升级到 v5，解决 Node.js 20 警告
        with:
          node-version: 22          # 使用当前 LTS 版本

      - name: Install hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: Compile and merge rules
        run: |
          mkdir -p merged
          hostlist-compiler -c config.json -o merged/adg-rules.txt

          # 拉取 Loyalsoldier 的 GFW 域名列表并转换为仅对“直连”客户端生效的 AdGuard 规则
          {
            echo "! Title: GFW Blocklist (Direct Clients Only)"
            echo "! Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            curl -sL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt" | \
              sed -e 's/\r//g' -e '/^[[:space:]]*$/d' -e '/^[!#]/d' -e 's#^#||#; s#$#^$client='\''直连'\''#'
          } > merged/adg_gfw_direct.txt

          # 转换为仅对“代理”客户端生效的 GFW HTTPS/SVCB 降级规则 (防 Fake-IP 绕过与 ECH 阻断)
          {
            echo "! Title: GFW HTTPS/SVCB Rewrite (Proxy Clients Only)"
            echo "! Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            curl -sL "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt" | \
              sed -e 's/\r//g' -e '/^[[:space:]]*$/d' -e '/^[!#]/d' -e 's#^#||#; s#$#^$dnstype=HTTPS|SVCB,dnsrewrite=NOERROR,client=代理|OC#'
          } > merged/adg_gfw_https_reject.txt

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-merge ADG rules"
          file_pattern: "merged/*.txt"
