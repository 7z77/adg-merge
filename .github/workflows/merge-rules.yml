name: Merge ADG Rules

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-24.04          # 固定版本，避免 Ubuntu 26 迁移警告
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5   # 升级到 v5，解决 Node.js 20 警告

      - name: Setup Node.js
        uses: actions/setup-node@v5 # 升级到 v5，解决 Node.js 20 警告
        with:
          node-version: 22          # 使用当前 LTS 版本

      - name: Install hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: Compile and merge rules
        run: |
          mkdir -p merged
          hostlist-compiler -c config.json -o merged/adg-rules.txt

      - name: Convert to Loon format
        run: |
          python3 -c '
          import re

          input_file = "merged/adg-rules.txt"
          output_file = "merged/loon-rules.list"
          rules = []

          with open(input_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  # 过滤空行与注释
                  if not line or line.startswith("!") or line.startswith("#"):
                      continue
                  
                  # 转换白名单放行规则 (如 @@||example.com^ 或 @@example.com)
                  if line.startswith("@@"):
                      clean = re.sub(r"^@@\|\|?", "", line)
                      clean = re.sub(r"\^.*$", "", clean).strip()
                      if clean and "/" not in clean and "*" not in clean:
                          rules.append(f"DOMAIN-SUFFIX,{clean},DIRECT")
                  # 转换拦截规则 (如 ||example.com^ 或 hosts 模式)
                  else:
                      clean = re.sub(r"^\|\|", "", line)
                      clean = re.sub(r"\^.*$", "", clean).strip()
                      # 处理 hosts 格式 0.0.0.0 domain
                      if clean.startswith("0.0.0.0 ") or clean.startswith("127.0.0.1 "):
                          parts = clean.split()
                          if len(parts) > 1:
                              clean = parts[1]
                      if clean and "/" not in clean and "*" not in clean:
                          rules.append(f"DOMAIN-SUFFIX,{clean},REJECT")

          # 保持原顺序去重
          seen = set()
          deduped_rules = []
          for r in rules:
              if r not in seen:
                  seen.add(r)
                  deduped_rules.append(r)

          with open(output_file, "w", encoding="utf-8") as out:
              out.write("\n".join(deduped_rules) + "\n")
          print(f"Loon 规则转换完成，共生成 {len(deduped_rules)} 条规则")
          '

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-merge ADG rules & loon list"
          file_pattern: "merged/*"
